server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

  # API + uploaded media go to Django; the browser sees ONE origin, so the HttpOnly refresh cookie stays same-site.
  location /api/    { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  # Uploaded photos live on a volume shared with the backend (file names are random, not guessable).
  location /media/  { alias /srv/media/; expires 7d; add_header Cache-Control "private"; }
  location /static/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
